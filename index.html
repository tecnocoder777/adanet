<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 60px;
    overflow: hidden;
    background: transparent;
}

#ad-wrapper {
    width: 100%;
    height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#ad-content {
    width: 468px;
    height: 60px;
    flex-shrink: 0;
    transform-origin: center center;
}
</style>
</head>

<body>

<div id="ad-wrapper">
    <div id="ad-content">
        <script>
        var atOptions = {

</div>

<script>
function fitAd() {
    var content = document.getElementById('ad-content');
    var scale = Math.min(1, window.innerWidth / 468);
    content.style.transform = 'scale(' + scale + ')';
}

fitAd();
window.addEventListener('resize', fitAd);
</script>
